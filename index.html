<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Vault">
<meta name="theme-color" content="#161618">
<meta name="robots" content="noindex">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<link rel="stylesheet" href="style.css">
<title>Vault</title>
</head>
<body>
<div id="app">
  <header>
    <div class="top">
      <div>
        <div id="date" class="date"></div>
        <div id="quip" class="quip"></div>
      </div>
      <button id="refresh" class="iconbtn" aria-label="Refresh">
        <svg viewBox="0 0 24 24" class="wheel"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="2.6"/><path d="M12 9.4V5.2M14.25 13.3l3.6 2.1M9.75 13.3l-3.6 2.1"/><circle class="k" cx="12" cy="4.6" r="1.5"/><circle class="k" cx="18.4" cy="15.7" r="1.5"/><circle class="k" cx="5.6" cy="15.7" r="1.5"/></svg>
      </button>
    </div>
  </header>

  <main id="main">
    <section id="wrapzone"></section>
    <section id="cards"></section>
    <section id="side"></section>
  </main>

  <section id="deck" hidden></section>

  <div id="toast" class="toast" hidden></div>

  <footer>
    <div id="bar" class="bar">
      <button id="attach" class="iconbtn small" aria-label="Add a photo or file">
        <svg viewBox="0 0 24 24"><path d="M21 12.5l-8.4 8.4a5 5 0 0 1-7.1-7.1l8.8-8.8a3.3 3.3 0 0 1 4.7 4.7l-8.8 8.8a1.7 1.7 0 0 1-2.4-2.4l8-8"/></svg>
      </button>
      <div id="chips" class="chips"></div>
      <input id="barinput" placeholder="Tell me something, or ask with ?" autocomplete="off" enterkeyhint="send">
      <input id="file" type="file" accept="image/*,application/pdf,*/*" multiple hidden>
    </div>
    <div id="status" class="status"></div>
  </footer>
</div>

<div id="setup" hidden>
  <div class="setupcard">
    <div class="date">Set up Vault</div>
    <p class="quip">Scan the QR code on your Mac, or paste the setup code here.</p>
    <textarea id="setupcode" placeholder="Setup code"></textarea>
    <button id="setupgo" class="pill primary">Continue</button>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
